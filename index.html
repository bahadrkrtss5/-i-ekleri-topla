<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff7aa8">
<title>Çiçekler Senin İçin 🌸</title>
<style>
  :root { --pink:#ff4f7b; --pink2:#ff8fab; --cream:#fff6f0; --ink:#3a2330; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#8fd3ff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); touch-action:none; user-select:none; -webkit-user-select:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .hidden { display:none !important; }

  /* HUD */
  #hud { position:fixed; top:max(10px, env(safe-area-inset-top)); left:10px; right:10px; display:flex; gap:8px; align-items:center; justify-content:space-between; pointer-events:none; z-index:5; flex-wrap:wrap; }
  .pill { background:rgba(255,255,255,.88); backdrop-filter:blur(6px); border-radius:999px; padding:7px 14px; font-weight:700; font-size:14px; box-shadow:0 2px 10px rgba(0,0,0,.15); }
  .pill.big { font-size:18px; background:linear-gradient(135deg,#fff,#ffe3ec); }
  .pill.warn { background:#ff4f4f; color:#fff; animation:pulse .6s infinite alternate; }
  .pill.btn { pointer-events:auto; border:0; cursor:pointer; font-size:16px; padding:7px 12px; }
  #hud .grow { flex:1; }
  @keyframes pulse { to { transform:scale(1.08); } }

  #toast { position:fixed; left:50%; bottom:max(24px, env(safe-area-inset-bottom)); transform:translate(-50%, 30px); opacity:0; transition:.3s; background:rgba(40,20,35,.85); color:#fff; padding:12px 18px; border-radius:16px; font-weight:600; text-align:center; max-width:88vw; pointer-events:none; z-index:6; line-height:1.4; }
  #toast.show { opacity:1; transform:translate(-50%, 0); }
  #toast small { font-weight:400; opacity:.85; }

  /* joystick */
  #joyBase { position:fixed; width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,.25); border:2px solid rgba(255,255,255,.7); transform:translate(-50%,-50%); display:none; pointer-events:none; z-index:4; }
  #joyBase.on { display:block; }
  #joyKnob { position:absolute; left:50%; top:50%; width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.9); box-shadow:0 2px 8px rgba(0,0,0,.25); transform:translate(-50%,-50%); }

  /* overlay */
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 30%, rgba(255,200,220,.55), rgba(40,20,50,.65)); backdrop-filter:blur(4px); z-index:10; padding:16px; overflow:auto; touch-action:pan-y; }
  .card { background:var(--cream); border-radius:28px; padding:26px 22px; width:min(440px, 100%); text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.35); animation:pop .35s ease-out; }
  @keyframes pop { from { transform:scale(.85); opacity:0; } }
  h1 { margin:0 0 4px; font-size:28px; color:var(--pink); }
  h2 { margin:6px 0 8px; font-size:24px; color:var(--pink); }
  .sub { margin:0 0 14px; opacity:.75; }
  .ask { font-weight:800; font-size:18px; margin:10px 0; }
  .hint { font-size:13px; opacity:.65; margin:14px 0 0; }
  .chars { display:flex; gap:14px; justify-content:center; }
  .char { border:0; background:#fff; border-radius:22px; padding:12px 10px 10px; width:46%; cursor:pointer; box-shadow:0 6px 18px rgba(255,79,123,.25); transition:transform .15s; font:inherit; color:inherit; }
  .char:active, .char:hover { transform:translateY(-4px) scale(1.03); }
  .char img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:50%; border:4px solid var(--pink2); display:block; }
  .char span { display:block; margin-top:8px; font-weight:800; font-size:17px; }
  .who { display:flex; align-items:center; justify-content:center; gap:12px; font-size:26px; color:var(--pink); }
  .who img { width:64px; height:64px; border-radius:50%; object-fit:cover; border:3px solid var(--pink2); }
  .lvls { display:grid; gap:8px; margin:10px 0 14px; }
  .lvl { display:flex; align-items:center; gap:12px; border:2px solid #ffd0de; background:#fff; border-radius:16px; padding:10px 14px; font:inherit; color:inherit; cursor:pointer; text-align:left; }
  .lvl b { display:grid; place-items:center; width:34px; height:34px; border-radius:50%; background:var(--pink2); color:#fff; flex:none; }
  .lvl span { font-weight:700; }
  .lvl.current { border-color:var(--pink); box-shadow:0 0 0 3px rgba(255,79,123,.2); }
  .lvl.locked { opacity:.45; cursor:not-allowed; }
  .lvl.locked b { background:#bbb; }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
  .btn { border:0; background:linear-gradient(135deg,var(--pink),#ff7a9c); color:#fff; font:inherit; font-weight:800; padding:13px 22px; border-radius:999px; cursor:pointer; box-shadow:0 6px 16px rgba(255,79,123,.4); }
  .btn.ghost { background:#fff; color:var(--pink); box-shadow:inset 0 0 0 2px var(--pink2); }
  .btn:active { transform:scale(.97); }
  .burst { font-size:54px; animation:pulse .7s infinite alternate; }
  .msg { font-size:18px; font-weight:600; line-height:1.45; margin:6px 0 10px; }
  .polas { display:flex; justify-content:center; margin-bottom:14px; padding-top:6px; }
  .polaroid { margin:0; background:#fff; padding:7px 7px 24px; box-shadow:0 6px 18px rgba(0,0,0,.25); width:46%; }
  .polaroid img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; }
  .polaroid.p0 { transform:rotate(-5deg) translateX(8px); }
  .polaroid.p1 { transform:rotate(4deg) translateX(-8px) translateY(6px); }

  #nofile { position:fixed; inset:0; display:none; place-items:center; background:#fff6f0; z-index:99; padding:24px; text-align:center; font-size:17px; line-height:1.6; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="pill" id="hLevel"></div>
  <div class="pill big" id="hFlowers">🌸 0/0</div>
  <div class="pill hidden" id="hTime"></div>
  <span class="grow"></span>
  <button class="pill btn" id="bMute" aria-label="Ses">🔊</button>
  <button class="pill btn" id="bMenu" aria-label="Menü">☰</button>
</div>
<div id="toast"></div>
<div id="joyBase"><div id="joyKnob"></div></div>
<div id="overlay" class="hidden"></div>

<div id="nofile"><div>
  <b>Bu oyun doğrudan dosyadan açılamaz 🙈</b><br>
  GitHub Pages'e yükleyip linkten aç<br>ya da klasörde <code>python3 -m http.server</code> çalıştırıp<br><code>http://localhost:8000</code> adresine git.
</div></div>
<script>
  if (location.protocol === 'file:') document.getElementById('nofile').style.display = 'grid';
</script>
<script type="module" src="game.js"></script>
</body>
</html>
